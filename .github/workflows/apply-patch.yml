# D-913 — مسارُ الرقع: فرعٌ اسمُه patch/<x> يحمل patches/*.patch (git format-patch) و/أو
# patches/run.sh (سكربتٌ يولّد ما لا يُنقل نصّاً: صورٌ، ملفّاتٌ ثنائيّة). يُطبَّق على main
# ثمّ يُحذف الفرع. السبب: أداةُ الدفع من الجلسة تُرسل الملفَّ كاملاً ونصّاً فقط، وإعادةُ
# كتابة ملفٍّ كبير تُفسد نصّه — والرقعةُ والسكربتُ صغيران مهما كبر الناتج.
# -C0: سطورُ السياق العربيّة قد تفقد تشكيلها في النقل، والرقعةُ تُولَّد دائماً على رأس main.
# الفشلُ يوقف المسار قبل الدفع ويُبقي الفرعَ للفحص.
name: apply-patch

on:
  push:
    branches:
      - "patch/**"

permissions:
  contents: write

concurrency:
  group: apply-patch
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Fetch patch branch
        run: |
          git fetch origin "${{ github.ref_name }}"
          mkdir -p /tmp/p
          git archive "origin/${{ github.ref_name }}" patches | tar -x -C /tmp/p
          ls -la /tmp/p/patches

      - name: Apply text patches (if any)
        run: |
          set -euo pipefail
          git config user.name "Claude"
          git config user.email "noreply@anthropic.com"
          shopt -s nullglob
          for f in /tmp/p/patches/*.patch; do git am -C0 "$f"; done

      - name: Run generator script (if any)
        run: |
          set -euo pipefail
          if [ -f /tmp/p/patches/run.sh ]; then
            pip install --quiet pillow numpy
            bash /tmp/p/patches/run.sh
            git add -A
            MSG="$(cat /tmp/p/patches/message.txt 2>/dev/null || echo 'chore: generated by patch branch [deploy]')"
            git -c user.name=Claude -c user.email=noreply@anthropic.com commit -m "$MSG" || echo "nothing to commit"
          fi
          git log --oneline -3

      - name: Push main
        run: git push origin HEAD:main

      - name: Delete patch branch
        run: git push origin --delete "${{ github.ref_name }}"

# مسارُ النشر الدائم — D-915.
#
# 🔴 العلّة: رفعُ الـ.aab إلى Play بيدٍ يمرّ عبر حوار ملفّات ويندوز، وهو
#    خارجَ متناول الوكيل. فالبناءُ والإرسالُ يجريان هنا على خوادم EAS،
#    ولا يلمسان جهازَ أحمد.
#
# 🔑 الشرطُ الوحيد: مفتاحُ حسابِ الخدمة (Google Service Account Key) مخزَّنٌ
#    في بيانات اعتماد Expo للمشروع — يُرفع مرّةً واحدة، ولا يعيش في المستودع.
#
# ⚖️ يعمل عند كلِّ دفعةٍ إلى main تمسّ apps/mobile فقط: بناءُ الويب لا
#    يستهلك دقائقَ EAS. والمسارات نسبيّةٌ إلى جذر المستودع لا إلى apps/mobile.
#
# ♻️ **أُعيد تفعيلُه — ١٤ سبتمبر ٢٠٢٦ (D-960b)، بكلمة أحمد «ارفع 1.8.0»**:
#    عُطِّل هذا المسارُ ساعاتٍ (D-960) كي تُبنى نسخةُ APK للتجربة بلا أن تصل
#    Play، **وعاد كما كان بحرفه**: مُشغِّلُ `push` ووظيفةُ `submit`.
#
# 🗑️ **وحُذف مسارُ الـAPK معه** (`android-apk-usb.yml`، بكلمة أحمد «اترك موضوع
#    apk .. ركّز عالتطبيق في Play Store»): **مسارٌ ثانٍ يبني التطبيقَ نفسَه
#    وصفةٌ ثانيةٌ لشيءٍ قائم** (القاعدة ٣) — **وهذا هو الطريقُ الواحد إلى
#    الجهاز: Play.** ومن أراد نسخةَ تجربةٍ يوماً فـ`eas build --profile preview`
#    من اللوحة، أو يُعاد الملفُّ (عشرون سطراً) — **ولا يبقى مسارٌ نائمٌ يُنسى
#    فيُبني بناءين بدولارين** (D-938/D-944).
name: Android → Play Alpha

# 🆕 D-944: ثلاثُ دفعاتٍ في نصف ساعةٍ أنتجت ثلاثةَ بناءاتٍ وثلاثةَ إرسالات (٧ سبتمبر)
#    وأكلت حصّةَ الشهر المجّانيّة في أربعة أيّام (D-938). دفعةٌ جديدةٌ على main
#    تُلغي ما قبلها وهو يبني — فالأخيرةُ تحمل كلَّ ما قبلها.
concurrency:
  cancel_in_progress: true
  group: ${{ workflow.filename }}-${{ github.ref }}

on:
  push:
    branches:
      - main
    paths:
      - apps/mobile/**
      # تعديلُ المسار نفسِه لا يشحن تطبيقاً
      - '!apps/mobile/.eas/**'
  workflow_dispatch: {}

jobs:
  build:
    name: Build Android (production)
    type: build
    params:
      platform: android
      profile: production

  submit:
    name: Submit to Play (closed track Alpha)
    needs: [build]
    type: submit
    params:
      build_id: ${{ needs.build.outputs.build_id }}
      profile: production

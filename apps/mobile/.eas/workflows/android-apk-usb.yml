# مسارُ التجربة على الجهاز — D-960 (١٤ سبتمبر ٢٠٢٦).
#
# 🔑 أمرُ أحمد: «ابغاك ترفعه لي باستخدام USB .. بدون ما ترفعه في بلاي ستور ..
#    بجربه أوّل شيء». **فالبناءُ هنا APK للتركيب المباشر، ولا وظيفةَ إرسالٍ
#    فيه أصلاً** — Play لا تُلمس من هذا الملفّ بحال، لا بخطأٍ ولا بسهو.
#
# ⚖️ ولماذا ملفٌّ ثانٍ لا فرعٌ في الأوّل: **مسارٌ لا يحمل `submit` لا يستطيع
#    النشرَ** — وشرطٌ داخل مسارٍ يملك الوظيفةَ يعتمد على صحّة الشرط.
#    والمسارُ الأوّل (`android-alpha.yml`) معطَّلُ المُشغِّل ما دام هذا يعمل،
#    **فدفعةٌ واحدةٌ = بناءٌ واحد = دولارٌ واحد** (D-938/D-950).
#
# 📦 الناتج: `preview` من `eas.json` — `distribution: internal` و
#    `buildType: apk`، **ولا `autoIncrement`**: نسخةُ تجربةٍ لا إصدارُ متجر.
#
# ⚠️ والتركيبُ يشترط إزالةَ نسخة Play أوّلاً: تلك موقَّعةٌ بمفتاح Google
#    (Play App Signing) وهذه بمفتاح المشروع — **وأندرويد يرفض التركيبَ فوق
#    توقيعٍ مختلف.** البياناتُ في Supabase لا على الجهاز، فالدخولُ من جديد
#    يستعيد كلَّ شيء.
name: Android → APK (USB test)

concurrency:
  cancel_in_progress: true
  group: ${{ workflow.filename }}-${{ github.ref }}

on:
  push:
    branches:
      - main
    paths:
      - apps/mobile/**
      # تعديلُ المسار نفسِه لا يشحن تطبيقاً
      - '!apps/mobile/.eas/**'
  workflow_dispatch: {}

jobs:
  build:
    name: Build Android APK (preview)
    type: build
    params:
      platform: android
      profile: preview
